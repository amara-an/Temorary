<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>휴무 신청 달력 · 시제품</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#172235;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}header{background:#163451;color:white;padding:20px}main{max-width:1100px;margin:20px auto;padding:0 14px}.layout{display:grid;grid-template-columns:1fr 330px;gap:16px}.panel{background:white;border:1px solid #dfe5eb;border-radius:14px;padding:18px;margin-bottom:16px}h1{font-size:22px;margin:0}h2{font-size:17px;margin:0 0 14px}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #cbd5df;background:white;border-radius:8px;padding:8px 12px}button.primary{background:#1767a4;color:white;border-color:#1767a4}button:disabled{opacity:.45;cursor:not-allowed}.toolbar,.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{text-align:center;font-size:12px;color:#667788;padding:8px 0}.day{min-height:77px;text-align:left;padding:8px 5px;display:flex;flex-direction:column;gap:5px}.day.selected{outline:2px solid #1767a4}.day small{font-size:11px;color:#526578}.day.full{background:#fff0ee}.day.mine{background:#eaf8ef}.muted{color:#65768a;font-size:13px}.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}.field input,.field select{padding:9px;border:1px solid #cbd5df;border-radius:8px;width:100%}.pill{border-radius:30px;padding:3px 8px;background:#eaf0f5;font-size:12px}.item{padding:10px 0;border-bottom:1px solid #e9edf1}.item:last-child{border:0}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.danger{color:#bd3838}.notice{padding:10px;background:#f1f6fb;border-radius:8px;font-size:13px}.stack{display:grid;gap:7px}.group-line{display:flex;align-items:center;gap:6px}.group-line input{min-width:0}.group-line input[type=number]{width:75px}.group-line input[type=text]{flex:1}.status{font-size:12px;font-weight:600}footer{text-align:center;padding:18px;color:#718094;font-size:12px}@media(max-width:760px){.layout{grid-template-columns:1fr}.day{min-height:62px;padding:5px 2px}.day small{font-size:10px}header{padding:15px}}</style></head><body><header><h1>휴무 신청 달력</h1><div style="opacity:.8;font-size:13px;margin-top:5px">시제품 · 브라우저 로컬 저장 · 실제 회사 운영 전 서버 연결 필요</div></header><main><div class="layout"><section><div class="panel"><div class="toolbar"><h2 id="monthTitle"></h2><div><button id="prev">◀</button> <button id="next">▶</button></div></div><div class="calendar" id="calendar"></div><div class="muted" style="margin-top:10px">날짜를 선택하면 해당 그룹의 신청 가능 인원을 확인할 수 있습니다.</div></div><div class="panel"><h2 id="dateTitle">날짜 선택</h2><div id="availability"></div><div id="requests"></div></div></section><aside><div class="panel"><h2>직원 · 신청</h2><label class="field">직원 이름<input id="employee" placeholder="이름 입력"></label><label class="field">근무 포지션<select id="position"></select></label><label class="field">출근시간 그룹<select id="shift"></select></label><button class="primary" id="apply" style="width:100%">선택 날짜에 휴무 신청</button><div class="muted" style="margin-top:8px">두 그룹의 잔여 한도를 모두 확인합니다. 신청 즉시 자리 확보, 관리자가 최종 승인합니다.</div></div><div class="panel"><h2>관리자 · 그룹 설정</h2><div class="muted">그룹 이름과 일일 기본 한도를 변경하거나 추가하세요.</div><h3>근무 포지션</h3><div id="positions" class="stack"></div><button id="addPosition">+ 포지션 추가</button><h3>출근시간</h3><div id="shifts" class="stack"></div><button id="addShift">+ 시간 그룹 추가</button></div><div class="panel"><h2>관리자 · 날짜별 예외</h2><div class="muted" id="exceptionDate"></div><label class="field">분류<select id="exceptionType"><option value="positions">근무 포지션</option><option value="shifts">출근시간</option></select></label><label class="field">그룹<select id="exceptionGroup"></select></label><label class="field">해당 날짜 한도<input type="number" id="exceptionLimit" min="0" value="1"></label><div class="actions"><button class="primary" id="saveException">예외 저장</button><button id="clearException">예외 삭제</button></div><div id="exceptionList" class="muted" style="margin-top:10px"></div></div><div class="panel"><h2>데이터 관리</h2><div class="actions"><button id="export">신청 내역 CSV</button><button id="reset">시제품 초기화</button></div><p class="muted">이 시제품은 현재 브라우저에만 저장됩니다. 다른 기기와 공유되지 않습니다.</p></div></aside></div></main><footer>휴무 신청 달력 · 프로토타입 v1</footer><script>
const KEY='leave_calendar_proto_v1';const initial=()=>({groups:{positions:[{id:'p1',name:'포지션 A',limit:3},{id:'p2',name:'포지션 B',limit:2}],shifts:[{id:'s1',name:'09:00조',limit:3},{id:'s2',name:'13:00조',limit:2}]},exceptions:{},requests:[]});let data;try{data=JSON.parse(localStorage.getItem(KEY))||initial()}catch{data=initial()}let view=new Date();view.setDate(1);let selected=fmt(new Date());function fmt(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function el(id){return document.getElementById(id)}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function group(type,id){return data.groups[type].find(g=>g.id===id)}function limit(type,id,date){return data.exceptions[`${date}|${type}|${id}`]??group(type,id)?.limit??0}function used(type,id,date){return data.requests.filter(r=>r.date===date&&r[type=== 'positions'?'position':'shift']===id&&['pending','approved'].includes(r.status)).length}function opts(type){return data.groups[type].map(g=>`<option value="${escapeHtml(g.id)}">${escapeHtml(g.name)}</option>`).join('')}function render(){let oldP=el('position').value,oldS=el('shift').value,oldE=el('exceptionGroup').value;el('position').innerHTML=opts('positions');el('shift').innerHTML=opts('shifts');if(group('positions',oldP))el('position').value=oldP;if(group('shifts',oldS))el('shift').value=oldS;let et=el('exceptionType').value;el('exceptionGroup').innerHTML=opts(et);if(group(et,oldE))el('exceptionGroup').value=oldE;renderGroups();renderCalendar();renderDate()}function renderGroups(){for(const [type,target] of [['positions','positions'],['shifts','shifts']]){el(target).innerHTML=data.groups[type].map(g=>`<div class="group-line"><input aria-label="그룹 이름" type="text" data-type="${type}" data-id="${g.id}" data-prop="name" value="${escapeHtml(g.name)}"><input aria-label="기본 한도" type="number" min="0" data-type="${type}" data-id="${g.id}" data-prop="limit" value="${g.limit}"><button data-delete="${type}|${g.id}" title="그룹 삭제">×</button></div>`).join('')}}function renderCalendar(){el('monthTitle').textContent=`${view.getFullYear()}년 ${view.getMonth()+1}월`;let start=new Date(view.getFullYear(),view.getMonth(),1).getDay(),last=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();let html=['일','월','화','수','목','금','토'].map(x=>`<div class="weekday">${x}</div>`).join('');for(let i=0;i<start;i++)html+='<div></div>';let p=el('position').value,s=el('shift').value;for(let day=1;day<=last;day++){let date=fmt(new Date(view.getFullYear(),view.getMonth(),day)),lp=limit('positions',p,date)-used('positions',p,date),ls=limit('shifts',s,date)-used('shifts',s,date),free=Math.max(0,Math.min(lp,ls));html+=`<button class="day ${selected===date?'selected':''} ${free===0?'full':''}" data-date="${date}"><span>${day}</span><small>${free===0?'마감':`잔여 ${free}명`}</small></button>`}el('calendar').innerHTML=html}function renderDate(){el('dateTitle').textContent=`${selected} 신청 현황`;el('exceptionDate').textContent=`선택 날짜: ${selected}`;let p=el('position').value,s=el('shift').value;el('availability').innerHTML=[['positions',p],['shifts',s]].map(([t,id])=>{let g=group(t,id);return g?`<div class="item">${escapeHtml(g.name)}: <b>${used(t,id,selected)} / ${limit(t,id,selected)}</b>명</div>`:''}).join('');let requests=data.requests.filter(r=>r.date===selected).sort((a,b)=>a.createdAt.localeCompare(b.createdAt));el('requests').innerHTML='<h3>신청자 목록</h3>'+(requests.length?requests.map(r=>`<div class="item"><b>${escapeHtml(r.employee)}</b> <span class="pill">${r.status==='pending'?'승인 대기':r.status==='approved'?'승인':r.status==='rejected'?'반려':'취소'}</span><div class="muted">${escapeHtml(group('positions',r.position)?.name||'삭제된 그룹')} · ${escapeHtml(group('shifts',r.shift)?.name||'삭제된 그룹')} · ${new Date(r.createdAt).toLocaleString('ko-KR')}</div>${r.status==='pending'?`<div class="actions"><button data-status="${r.id}|approved">승인</button><button data-status="${r.id}|rejected">반려</button><button data-status="${r.id}|cancelled">취소</button></div>`:r.status==='approved'?`<div class="actions"><button data-status="${r.id}|cancelled">승인 취소</button></div>`:''}</div>`).join(''):'<p class="muted">신청 내역 없음</p>');el('exceptionList').innerHTML=Object.entries(data.exceptions).filter(([k])=>k.startsWith(selected+'|')).map(([k,v])=>{let [,t,id]=k.split('|');return `${escapeHtml(group(t,id)?.name||id)}: ${v}명`}).join(' · ')||'등록된 예외 없음'}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.date){selected=b.dataset.date;render();return}if(b.dataset.status){let [id,status]=b.dataset.status.split('|'),r=data.requests.find(x=>x.id===id);if(r){r.status=status;save()}return}if(b.dataset.delete){let [type,id]=b.dataset.delete.split('|');if(data.requests.some(r=>r[type==='positions'?'position':'shift']===id&&['pending','approved'].includes(r.status))){alert('활성 신청이 있는 그룹은 삭제할 수 없습니다.');return}if(confirm('이 그룹을 삭제할까요?')){data.groups[type]=data.groups[type].filter(g=>g.id!==id);save()}return}});document.addEventListener('change',e=>{let t=e.target;if(t.dataset.prop){let g=group(t.dataset.type,t.dataset.id);if(!g)return;if(t.dataset.prop==='limit'){let v=Number(t.value);if(!Number.isInteger(v)||v<0){alert('한도는 0 이상의 정수여야 합니다.');render();return}g.limit=v}else{if(!t.value.trim()){render();return}g.name=t.value.trim()}save()}});el('position').onchange=()=>render();el('shift').onchange=()=>render();el('exceptionType').onchange=()=>render();el('prev').onclick=()=>{view.setMonth(view.getMonth()-1);render()};el('next').onclick=()=>{view.setMonth(view.getMonth()+1);render()};function addGroup(type){let name=prompt('그룹 이름을 입력하세요');if(!name?.trim())return;data.groups[type].push({id:crypto.randomUUID(),name:name.trim(),limit:2});save()}el('addPosition').onclick=()=>addGroup('positions');el('addShift').onclick=()=>addGroup('shifts');el('apply').onclick=()=>{let employee=el('employee').value.trim(),position=el('position').value,shift=el('shift').value;if(!employee){alert('직원 이름을 입력하세요.');return}if(!position||!shift){alert('그룹을 선택하세요.');return}if(data.requests.some(r=>r.date===selected&&r.employee===employee&&['pending','approved'].includes(r.status))){alert('해당 날짜에 이미 신청했습니다.');return}if(used('positions',position,selected)>=limit('positions',position,selected)||used('shifts',shift,selected)>=limit('shifts',shift,selected)){alert('그룹 한도가 마감되었습니다.');return}data.requests.push({id:crypto.randomUUID(),employee,position,shift,date:selected,status:'pending',createdAt:new Date().toISOString()});save();alert('신청이 접수되었습니다. 관리자 승인을 기다려 주세요.')};el('saveException').onclick=()=>{let t=el('exceptionType').value,id=el('exceptionGroup').value,v=Number(el('exceptionLimit').value);if(!id||!Number.isInteger(v)||v<0){alert('유효한 그룹과 한도를 입력하세요.');return}data.exceptions[`${selected}|${t}|${id}`]=v;save()};el('clearException').onclick=()=>{delete data.exceptions[`${selected}|${el('exceptionType').value}|${el('exceptionGroup').value}`];save()};el('reset').onclick=()=>{if(confirm('모든 시제품 데이터를 초기화할까요?')){data=initial();save()}};el('export').onclick=()=>{let rows=[['날짜','직원','근무 포지션','출근시간','상태','접수시각'],...data.requests.map(r=>[r.date,r.employee,group('positions',r.position)?.name||'',group('shifts',r.shift)?.name||'',r.status,r.createdAt])];let csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='휴무신청내역.csv';a.click();URL.revokeObjectURL(url)};render();
</script></body></html>
